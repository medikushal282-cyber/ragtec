version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ragsec_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ragsecpassword
      POSTGRES_DB: ragsec_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ragsec_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ragsec_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redisdata:
